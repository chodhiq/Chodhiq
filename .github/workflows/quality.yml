name: Quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npx expo export --platform web --output-dir dist-ci
      - name: Export Android JavaScript bundle and source map
        run: npx expo export --platform android --output-dir dist-android-ci --source-maps
      - name: Verify vulnerable build tools are absent from the Android bundle
        run: node scripts/verify-android-bundle.cjs dist-android-ci
      - name: Audit shipped Android JavaScript dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            echo "npm audit could not complete (exit $audit_status)."
            cat npm-audit.json
            exit "$audit_status"
          fi
          node scripts/check-android-bundle-audit.cjs npm-audit.json dist-android-ci "$audit_status"
      - name: Verify provider dashboard
        working-directory: business-dashboard
        run: |
          npm ci
          npm run verify
          npm audit --omit=dev --audit-level=high
      - name: Verify administration dashboard and Edge Functions
        working-directory: admin-dashboard
        run: |
          npm ci
          npm run verify
          npm audit --omit=dev --audit-level=high
      - name: Verify coming-soon site
        working-directory: coming-soon
        run: |
          npm ci
          npm run verify
          npm audit --omit=dev --audit-level=high
      - name: Reject untracked deployment and unsafe database regressions
        run: |
          test -f supabase/functions/deliver-provider-leads/index.ts
          test -f supabase/functions/ingest-mvp-event/index.ts
          grep -q "record_user_moderation_change" supabase/migrations/20260901130000_security_remediation.sql
          grep -q "drop policy.*Clients record MVP events" supabase/migrations/20260901130000_security_remediation.sql
