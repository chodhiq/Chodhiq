name: Quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npx expo export --platform web --output-dir dist-ci
      # The current braces advisory has no patched release; npm audit still fails
      # on every other high or critical production dependency finding.
      - name: Audit customer production dependencies
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit.json
          audit_status=$?
          set -e
          AUDIT_STATUS="$audit_status" node --input-type=commonjs -e '
            const fs = require("node:fs");
            const audit = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const ignored = new Set(["GHSA-vfj7-8cjw-p6xm"]);
            const blockers = Object.entries(audit.vulnerabilities || {}).filter(([name, item]) =>
              (item.severity === "high" || item.severity === "critical") &&
              !(name === "braces" && (item.via || []).every((via) => typeof via === "object" && ignored.has(via.url?.split("/").pop())))
            );
            if (blockers.length) {
              console.error("Unresolved high or critical production advisories:", blockers.map(([name]) => name).join(", "));
              process.exit(1);
            }
            if (process.env.AUDIT_STATUS !== "0" && !Object.keys(audit.vulnerabilities || {}).length) {
              console.error("npm audit failed without reporting vulnerability details.");
              process.exit(1);
            }
            console.log("No unexcepted high or critical production advisories.");
          ' || exit 1
      - name: Verify provider dashboard
        working-directory: business-dashboard
        run: |
          npm ci
          npm run verify
          npm audit --omit=dev --audit-level=high
      - name: Verify administration dashboard and Edge Functions
        working-directory: admin-dashboard
        run: |
          npm ci
          npm run verify
          npm audit --omit=dev --audit-level=high
      - name: Verify coming-soon site
        working-directory: coming-soon
        run: |
          npm ci
          npm run verify
          npm audit --omit=dev --audit-level=high
      - name: Reject untracked deployment and unsafe database regressions
        run: |
          test -f supabase/functions/deliver-provider-leads/index.ts
          test -f supabase/functions/ingest-mvp-event/index.ts
          grep -q "record_user_moderation_change" supabase/migrations/20260901130000_security_remediation.sql
          grep -q "drop policy.*Clients record MVP events" supabase/migrations/20260901130000_security_remediation.sql
