name: Publish approved legal pages

on:
  workflow_dispatch:
    inputs:
      approve_publication:
        description: I have reviewed these pages and approve publication
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      inputs.approve_publication
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the approved branch
        uses: actions/checkout@v4

      - name: Verify policy pages
        run: |
          if grep -Eiq 'private beta draft|do not publish before review|review required|review draft|not approved for publication' site-static/*.html; then
            echo "Remove internal draft and review markers before publication."
            exit 1
          fi
          test -f site-static/index.html
          test -f site-static/privacy.html
          test -f site-static/terms.html
          test -f site-static/delete-account.html
          test -f site-static/styles.css
          test -f site-static/robots.txt
          test -f site-static/sitemap.xml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-static

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
