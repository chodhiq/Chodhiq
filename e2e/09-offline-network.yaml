appId: com.chodhiq.app
tags:
  - android-only
onFlowComplete:
  - setAirplaneMode: disabled
---
- launchApp:
    clearState: true
- tapOn:
    id: btn-sign-in
- tapOn:
    id: input-email
- inputText: '${MAESTRO_EMAIL}'
- tapOn:
    id: input-password
- inputText: '${MAESTRO_PASSWORD}'
- tapOn:
    id: btn-sign-in
- assertVisible:
    id: tab-home
- setAirplaneMode: enabled
- tapOn:
    id: btn-home-search
- assertVisible:
    text: Offline — showing saved directory data
    optional: true
- assertVisible:
    text: Directory could not be refreshed
    optional: true
- assertVisible:
    id: btn-retry-directory
- tapOn:
    id: btn-retry-directory
- assertVisible:
    text: Offline — showing saved directory data
    optional: true
- assertVisible:
    text: Directory could not be refreshed
    optional: true
- assertVisible:
    id: btn-retry-directory
- assertVisible:
    id: btn-home-search
- setAirplaneMode: disabled
