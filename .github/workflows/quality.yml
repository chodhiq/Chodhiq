name: Quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npx expo export --platform web --output-dir dist-ci
      # These two upstream advisories have no patched releases. Keep the exception
      # limited to dependency paths caused only by those advisories.
      - name: Audit customer production dependencies
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit.json
          audit_status=$?
          set -e
          AUDIT_STATUS="$audit_status" node --input-type=commonjs -e '
            const fs = require("node:fs");
            const audit = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const ignored = new Set(["GHSA-vfj7-8cjw-p6xm", "GHSA-86w9-cpqp-85rv"]);
            const vulnerabilities = audit.vulnerabilities || {};
            function onlyIgnoredAdvisories(name, seen = new Set()) {
              if (seen.has(name) || !vulnerabilities[name]) return false;
              const path = new Set(seen).add(name);
              const via = vulnerabilities[name].via || [];
              return via.length > 0 && via.every((entry) =>
                typeof entry === "string"
                  ? onlyIgnoredAdvisories(entry, path)
                  : ignored.has(entry.url?.split("/").pop())
              );
            }
            const blockers = Object.entries(vulnerabilities).filter(([name, item]) =>
              (item.severity === "high" || item.severity === "critical") && !onlyIgnoredAdvisories(name)
            );
            if (blockers.length) {
              console.error("Unresolved high or critical production advisories:", blockers.map(([name]) => name).join(", "));
              process.exit(1);
            }
            if (process.env.AUDIT_STATUS !== "0" && !Object.keys(vulnerabilities).length) {
              console.error("npm audit failed without reporting vulnerability details.");
              process.exit(1);
            }
            console.log("No unexcepted high or critical production advisories; known unpatched advisories remain.");
          ' || exit 1
      - name: Verify provider dashboard
        working-directory: business-dashboard
        run: |
          npm ci
          npm run verify
          npm audit --omit=dev --audit-level=high
      - name: Verify administration dashboard and Edge Functions
        working-directory: admin-dashboard
        run: |
          npm ci
          npm run verify
          npm audit --omit=dev --audit-level=high
      - name: Verify coming-soon site
        working-directory: coming-soon
        run: |
          npm ci
          npm run verify
          npm audit --omit=dev --audit-level=high
      - name: Reject untracked deployment and unsafe database regressions
        run: |
          test -f supabase/functions/deliver-provider-leads/index.ts
          test -f supabase/functions/ingest-mvp-event/index.ts
          grep -q "record_user_moderation_change" supabase/migrations/20260901130000_security_remediation.sql
          grep -q "drop policy.*Clients record MVP events" supabase/migrations/20260901130000_security_remediation.sql
